services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - DATABASE_PATH=/app/data/menudb.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_AUTH_ENABLED=${JWT_AUTH_ENABLED:-false}
      - JWT_ISSUER=${JWT_ISSUER:-}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-}
      - JWT_JWKS_URL=${JWT_JWKS_URL:-}
    restart: unless-stopped

  # Test environment
  web-test:
    build: .
    ports:
      - "5001:5000"
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./tests:/app/tests
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - DATABASE_PATH=/app/data/test.db
      - SECRET_KEY=test-secret-key
      - TESTING=1
      - DEV_FAKE_USER_EMAIL=${DEV_FAKE_USER_EMAIL:-test@example.com}
    profiles:
      - test
    command: >
      sh -c "python -m tests.test_db_init && flask run --host=0.0.0.0"
